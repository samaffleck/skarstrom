name: Docs checks
description: >-
  Generated documentation pages are up to date, then mkdocs build --strict.
  Used by ci.yml (docs job) and docs.yml (build job); the caller checks out the
  repository and sets up Python first.
inputs:
  site-dir:
    description: Directory for the built site (mkdocs default when empty).
    required: false
    default: ""
  config-file:
    description: MkDocs configuration file (mkdocs.yml, or mkdocs.dev.yml for the development preview).
    required: false
    default: mkdocs.yml
runs:
  using: composite
  steps:
    - name: Generated pages are up to date
      shell: bash
      run: |
        python scripts/docs/gen_validation_page.py --check
        python scripts/docs/gen_adsorbent_library.py --check
    - name: mkdocs build --strict
      shell: bash
      env:
        SITE_DIR: ${{ inputs.site-dir }}
        CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-docs.txt
        mkdocs build --strict -f "$CONFIG_FILE" ${SITE_DIR:+--site-dir "$SITE_DIR"}
