# Release: build the Python wheels (cibuildwheel), an sdist that contains the
# submodule sources, and a full source tarball; tag the commit and attach them
# to a GitHub Release; and, when enabled, publish to PyPI (final versions) or
# TestPyPI (pre-releases) with trusted publishing (OpenID Connect, no tokens).
#
# What starts a release (see RELEASING.md):
#   * A push to main that changes the version in CMakeLists.txt
#     (ADSIM_PROJECT_VERSION + ADSIM_VERSION_SUFFIX) to one that has no tag
#     yet. This is the normal route: merging the release pull request that
#     prepare-release.yml keeps open. The workflow creates the tag v<version>.
#   * A pushed tag v<version> (the manual route; the tag must equal the version
#     in CMakeLists.txt at that commit).
#   * Actions > Release > Run workflow on main with "publish" ticked: releases
#     the version in CMakeLists.txt if it has no tag yet (e.g. to retry).
# Any other run (a manual run without "publish", a main push that leaves the
# version alone) only builds the artefacts. A final version is published only
# if CHANGELOG.md has its section, nothing is left under Unreleased and
# CITATION.cff carries it (`python scripts/release.py check <version>`), so
# main is never published under a version whose changelog does not list it.
#
# Publishing stays off until the repository owner sets up the trusted
# publishers and environments (RELEASING.md) and sets the repository variables:
#   PYPI_PUBLISH=true      final versions -> PyPI      (environment "pypi")
#   TESTPYPI_PUBLISH=true  pre-releases   -> TestPyPI  (environment "testpypi")
# The environments must accept deployments from main as well as v* tags.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    # Path filters apply to the branch push only; a tag push always runs.
    paths: [CMakeLists.txt]
  workflow_dispatch:
    inputs:
      publish:
        description: "Release the version in CMakeLists.txt if it has no tag yet (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the version and decide whether this run releases it
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          read_version() {  # CMakeLists.txt text on stdin -> version + suffix
            local text version suffix
            text="$(cat)"
            version="$(sed -n 's/^set(ADSIM_PROJECT_VERSION \([0-9.]*\)).*/\1/p' <<< "$text")"
            suffix="$(sed -n 's/^set(ADSIM_VERSION_SUFFIX "\([a-z0-9]*\)").*/\1/p' <<< "$text")"
            echo "${version}${suffix}"
          }
          full="$(read_version < CMakeLists.txt)"
          [ -n "$full" ] || { echo "::error::no version found in CMakeLists.txt"; exit 1; }
          if [[ "$full" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/v${full}" > /dev/null; }

          release=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v${full}" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt (v${full})"
              exit 1
            fi
            python3 scripts/release.py check "$full" || echo "::warning::released from a tag although the check above failed"
            release=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && { [ "$EVENT" = "push" ] || [ "$PUBLISH" = "true" ]; }; then
            if [ "$EVENT" = "push" ]; then
              previous=""
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                git fetch --quiet --depth=1 origin "$BEFORE"
                previous="$(git show "$BEFORE:CMakeLists.txt" | read_version)"
              fi
              if [ "$previous" = "$full" ]; then
                echo "The version is still ${full}: build only."
              elif tag_exists; then
                echo "::notice::v${full} is already tagged: build only."
              else
                echo "Version changed from ${previous:-?} to ${full}."
                release=true
              fi
            elif tag_exists; then
              echo "::error::v${full} is already tagged; nothing to publish."
              exit 1
            else
              release=true
            fi
            if [ "$release" = true ] && ! python3 scripts/release.py check "$full"; then
              echo "::error::${full} is not ready to publish (see above). Prepare the release with the Prepare release workflow or scripts/release.py prepare."
              exit 1
            fi
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::publish runs only on main (this run is on $GITHUB_REF)"
            exit 1
          fi
          {
            echo "version=${full}"
            echo "prerelease=${prerelease}"
            echo "release=${release}"
            echo "tag=v${full}"
          } >> "$GITHUB_OUTPUT"
          echo "version ${full} (pre-release: ${prerelease}, release: ${release})" | tee -a "$GITHUB_STEP_SUMMARY"

  wheels:
    name: Wheels ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64, runner: ubuntu-24.04, archs: x86_64 }
          - { name: manylinux aarch64, runner: ubuntu-24.04-arm, archs: aarch64 }
          - { name: macOS arm64, runner: macos-15, archs: arm64 }
          - { name: macOS x86_64, runner: macos-15-intel, archs: x86_64 }
          - { name: Windows x64, runner: windows-2022, archs: AMD64 }
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Build settings (Python versions, manylinux image, macOS deployment
      # target 13.3, tests) live in [tool.cibuildwheel] in pyproject.toml.
      # v4.3.3+ ships pip and certifi without the compromised eMudhra/emSign
      # CA (October 2026); never go below it.
      - uses: pypa/cibuildwheel@v4.3.4
        with:
          package-dir: .
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          retention-days: 30

  sdist:
    name: sdist (with submodule sources)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist .
          ls -l dist
      - name: Build and test a wheel from the sdist (offline source build)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python -m venv --upgrade-deps /tmp/venv
          CMAKE_BUILD_PARALLEL_LEVEL=4 /tmp/venv/bin/pip install dist/*.tar.gz pytest
          cd /tmp && /tmp/venv/bin/skarstrom --version
          /tmp/venv/bin/skarstrom examples run "Ward2022_Q100ccm" --json -q > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 30

  source-tarball:
    name: Full source tarball
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Create the tarball
        run: bash scripts/make_source_tarball.sh "${{ needs.version.outputs.version }}" source
      - uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: source/*.tar.gz
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: [version, wheels, sdist, source-tarball]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the tag and the release, upload its assets
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "${{ needs.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist
      # Creates the tag at this commit when it does not exist (a release from
      # main). A tag made with the workflow token starts no further workflow.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Skarstrom ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    # After the GitHub Release, so a published version always has its tag.
    needs: [version, github-release]
    if: >-
      needs.version.outputs.release == 'true' && needs.version.outputs.prerelease == 'false' &&
      vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/skarstrom
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-testpypi:
    name: Publish to TestPyPI
    # After the GitHub Release, so a published version always has its tag.
    needs: [version, github-release]
    if: >-
      needs.version.outputs.release == 'true' && needs.version.outputs.prerelease == 'true' &&
      vars.TESTPYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/skarstrom
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
