# Continuous integration: C++ build + tests on Linux, macOS and Windows, the
# Python wheel and its tests, the Emscripten build of the engine, and the docs.
#
# When it runs: on pull requests, on pushes to main, nightly, and by hand
# (Actions > CI > Run workflow, on any branch). A push to a feature branch does
# not start a run of its own; open a pull request (a draft is fine) or start it
# by hand. A new commit on a pull request cancels the run for the previous one.
#
# Test scope (ctest). The tests are in three tiers, set by ctest labels in
# core/test/CMakeLists.txt:
#   * the fast tier (no label): unit tests, "does it run" smoke tests on small
#     grids and a few cycles, and the cheap verification tests;
#   * `paper`: the paper replications (core/test/papers/);
#   * `slow`: verification that needs fine grids or many cycles.
# Pull requests run the fast tier on Linux, macOS and Windows
# (`ctest -LE "paper|slow"`). Pushes to main, the nightly run and manual runs
# (Actions > CI > Run workflow, on any branch: use it to run the paper suites
# on a pull request's branch before merging) run all three tiers on every
# platform.
#
# Emscripten. Pull requests build the engine with native WebAssembly
# exceptions (ADSIM_EMSCRIPTEN_EXCEPTIONS=wasm, the default and what the web
# front end ships). Pushes to main, nightly and manual runs also build it with
# JavaScript-based exceptions (=js). ctest's per-test timings are cached between runs, so the next run
# starts the longest tests first.
#
# Build caching: every C++ build goes through ccache, Windows included (Ninja
# + MSVC, preset windows-ninja-release). The engine library is built with a
# precompiled header, which ccache only caches with the sloppiness below (and,
# for Clang, a PCH without its timestamp: core/CMakeLists.txt); without it
# every engine source file was recompiled on every run.
#
# Pull requests that change no code skip the builds: the `changes` job lists
# the PR's files, and the C++, Python wheel, Emscripten and subproject jobs run
# only if one of them is not docs or repository metadata (Markdown files,
# docs/, mkdocs.yml, requirements-docs.txt, .gitattributes, CITATION.cff, issue
# templates). The docs and workflow-lint jobs always run. The Python wheel
# job also runs when a docs page or AGENTS.md changes, because it executes
# their code blocks (scripts/docs/run_doc_blocks.py); the other builds do not.
# Exceptions that DO count as code: docs/python.md (python/tests runs its example),
# python/README.md and THIRD_PARTY_NOTICES.md (packaged in the wheel, as are
# LICENSE and NOTICE). Pushes to main, nightly and manual runs build
# everything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (a new push cancels the old run) and per other branch.
# Every run on main has its own group: GitHub keeps one pending run per group and
# cancels the older pending ones, so a shared group lost the full-tier runs of
# most main pushes and the Daily release found no completed CI run. Main runs
# never cancel each other (public repository: parallel runs cost nothing).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # ccache: cache the translation units that use the engine's precompiled header.
  CCACHE_SLOPPINESS: pch_defines,time_macros
  HOMEBREW_NO_AUTO_UPDATE: "1"
  # The Emscripten version of the emscripten job (toolchain and cache keys).
  EMSCRIPTEN_VERSION: "6.0.13"

jobs:
  changes:
    name: Code changed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      wheel: ${{ steps.files.outputs.wheel }}
    steps:
      - name: Classify the pull request's files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "wheel=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: building everything." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Both names of a renamed file. The API lists at most 3000 files.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          code=false
          wheel=false
          if [ "$(wc -l < "$RUNNER_TEMP/files.txt")" -ge 3000 ]; then code=true; fi
          while IFS= read -r f; do
            case "$f" in
              # Their code blocks run against the wheel.
              docs/*.md|AGENTS.md) wheel=true; echo "wheel (doc code blocks): $f" ;;&
              # Read by the tests or packaged in the wheel.
              docs/python.md|python/README.md|THIRD_PARTY_NOTICES.md) code=true; echo "code: $f" ;;
              # Docs and repository metadata.
              *.md|docs/*|mkdocs.yml|requirements-docs.txt|.gitattributes|CITATION.cff|.github/ISSUE_TEMPLATE/*) echo "not code: $f" ;;
              *) code=true; echo "code: $f" ;;
            esac
          done < "$RUNNER_TEMP/files.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then wheel=true; fi
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "The pull request changes code: building everything." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Only docs and repository metadata changed: the C++, Python wheel, Emscripten and subproject jobs are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  cpp:
    name: C++ ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    # The all-tiers run (main, nightly, manual) is the long one: about 90 minutes
    # of tests on Linux, 65 on macOS and over 100 on Windows (MSVC code is slower
    # and the first run builds without a compiler cache or test timings).
    # Windows gets a larger limit so that the run is not cancelled near its end.
    # Pull-request fast-tier jobs finish in well under an hour.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            runner: ubuntu-24.04
            preset: linux-release
            jobs: 4
            timeout: 150
          - name: macOS arm64 (Apple clang)
            runner: macos-15
            preset: macos-release
            jobs: 3
            timeout: 150
          - name: Windows x64 (MSVC 2022)
            runner: windows-2022
            preset: windows-ninja-release
            jobs: 4
            timeout: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CoolProp runs Python at configure/build time to generate its fluid headers.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Ninja + MSVC needs the Visual Studio developer environment (cl, link,
      # the Windows SDK) on PATH.
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.preset }}
          max-size: 1G

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel ${{ matrix.jobs }}

      # ctest keeps each test's last duration in CTestCostData.txt and starts
      # the longest ones first. The file is restored from the previous run.
      - name: Restore test timings
        uses: actions/cache/restore@v4
        with:
          path: build/${{ matrix.preset }}/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: ctest-cost-${{ matrix.preset }}-

      - name: Test (fast tier)
        if: github.event_name == 'pull_request'
        run: ctest --preset ${{ matrix.preset }} -LE "paper|slow" --parallel ${{ matrix.jobs }} --timeout 900

      - name: Test (all tiers)
        if: github.event_name != 'pull_request'
        env:
          ADSIM_FUZZ_TRIALS: "96"  # robustness fuzz decks (the fast tier's default is 32)
        run: ctest --preset ${{ matrix.preset }} --parallel ${{ matrix.jobs }} --timeout 3600

      - name: Save test timings
        if: always() && hashFiles(format('build/{0}/Testing/Temporary/CTestCostData.txt', matrix.preset)) != ''
        uses: actions/cache/save@v4
        with:
          path: build/${{ matrix.preset }}/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.preset }}-${{ github.run_id }}

      - name: Install consumer (find_package)
        if: runner.os == 'Linux'
        run: BUILD_DIR=build/linux-release JOBS=4 bash scripts/test_install_consumer.sh

      - name: Example decks unchanged by the tests
        if: runner.os == 'Linux'
        # The tests that save example decks, adsorbent files and cycle templates
        # write exactly the committed bytes (the save is deterministic). Any
        # difference means a change that was not re-saved and committed, or a
        # test that writes a file it should not. The pull-request run covers
        # the fast tier; the run on main and the nightly run cover all tiers.
        run: |
          changed=$(git status --porcelain --untracked-files=all examples data)
          if [ -n "$changed" ]; then
            echo "::error::The test suite changed files under examples/ or data/. Re-save them (run the tests) and commit them with the change that caused it:"
            echo "$changed"
            git diff --stat -- examples data | tail -n 25
            exit 1
          else
            echo "The tests left examples/ and data/ unchanged."
          fi

      - name: Remove test output
        if: always()
        run: rm -rf core/Results

  python:
    name: Python wheel (Linux)
    needs: changes
    if: needs.changes.outputs.wheel == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python-wheel
          max-size: 1G
      - name: Build the wheel
        env:
          CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
      - name: Install into a fresh venv
        uses: ./.github/actions/install-and-run
        with:
          package: dist/*.whl
          extra-packages: matplotlib pint jsonschema pymoo
      - name: Test the installed wheel
        run: |
          cd /tmp && /tmp/venv/bin/skarstrom examples | head -3
          cd "$GITHUB_WORKSPACE" && /tmp/venv/bin/python -m pytest python/tests -q
      # The docs job has no built package, so the code blocks of docs/*.md and
      # AGENTS.md run here, against the installed wheel, with each run capped
      # at 3 cycles (the nightly full run is `--full`). About 35 s.
      - name: Run the documentation code blocks
        run: |
          /tmp/venv/bin/pip install scipy pandas
          /tmp/venv/bin/python scripts/docs/run_doc_blocks.py --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-ci
          path: dist/*.whl
          retention-days: 7

  emscripten:
    name: Engine with Emscripten
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      # "ccache em++" works as a compiler launcher (Emscripten docs, "Using a
      # compiler wrapper"); CMake reads the launcher from these variables.
      # emsdk is installed afresh on every run, so ccache identifies the
      # compiler by the pinned version instead of em++'s file time.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: emscripten-${{ env.EMSCRIPTEN_VERSION }}
          max-size: 1G
      - name: Use ccache for the Emscripten builds
        run: |
          {
            echo "CCACHE_COMPILERCHECK=string:emscripten-${EMSCRIPTEN_VERSION}"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
      - name: Build the subproject consumer with emcmake and run it under Node.js (native Wasm exceptions, the default)
        run: JOBS=4 bash scripts/test_subproject_consumer.sh --emscripten
      # The JS-exceptions variant is not what the web front end ships, so pull
      # requests skip it; pushes to main, nightly and manual runs build it.
      - name: The same with JavaScript-based exceptions (ADSIM_EMSCRIPTEN_EXCEPTIONS=js)
        if: github.event_name != 'pull_request'
        run: BUILD_DIR=build_subproject_emscripten_js JOBS=4 CMAKE_ARGS="-DADSIM_EMSCRIPTEN_EXCEPTIONS=js" bash scripts/test_subproject_consumer.sh --emscripten

  subproject:
    name: Subproject build (add_subdirectory)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: subproject
          max-size: 1G
      - name: Build and run the subproject consumer
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: JOBS=4 bash scripts/test_subproject_consumer.sh

  docs:
    name: Docs and generated pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release helper tests (scripts/release.py)
        run: python -m unittest discover -s scripts -p 'test_release.py' -v
      # Between releases the version carries a dev marker (0.9.1.dev0), so a
      # source build never reports a released version: fail if CMakeLists.txt
      # has a version that is already tagged (v*) without one.
      - name: Version is not a released one (scripts/release.py check-dev)
        run: python scripts/release.py check-dev
      - name: Examples module is up to date
        run: python scripts/gen_examples_module.py --check
      - uses: ./.github/actions/docs-checks

  lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: actionlint
        run: |
          python -m pip install --upgrade pip
          python -m pip install actionlint-py
          actionlint
