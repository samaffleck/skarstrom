# Build the documentation with MkDocs (Material) and deploy it to GitHub Pages
# on every push to main. In the repository settings, set Pages > Source to
# "GitHub Actions" once.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages are up to date
        run: |
          python scripts/docs/gen_validation_page.py --check
          python scripts/docs/gen_adsorbent_library.py --check
      - name: Build
        run: |
          python -m pip install -r requirements-docs.txt
          mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
