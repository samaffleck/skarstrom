[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "skarstrom"
dynamic = ["version"]
description = "Pressure and temperature swing adsorption (PSA/VSA/TSA) cycle simulator"
readme = "python/README.md"
requires-python = ">=3.9"
# Licence: keep in step with LICENSE, NOTICE, README.md (badge) and CITATION.cff.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Sam Affleck" }]
keywords = ["adsorption", "PSA", "VSA", "TSA", "simulation", "chemical engineering", "gas separation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]
examples = ["pandas>=1.3", "matplotlib>=3.5", "scipy>=1.7", "jupyter"]

[project.urls]
Homepage = "https://github.com/samaffleck/skarstrom"
Documentation = "https://samaffleck.github.io/skarstrom/"
Source = "https://github.com/samaffleck/skarstrom"
Issues = "https://github.com/samaffleck/skarstrom/issues"
Changelog = "https://github.com/samaffleck/skarstrom/blob/main/CHANGELOG.md"

[project.scripts]
skarstrom = "skarstrom.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/src/skarstrom"]
# Install only the extension module, the licence texts and the bundled data
# (the third-party projects' own install rules would otherwise add their
# headers and libraries).
install.components = ["python"]
install.strip = true
# The sdist carries the full C++ engine and the submodule sources it builds
# from (pip install skarstrom-<version>.tar.gz works offline). Large parts of
# the submodules that the build never touches are left out.
sdist.exclude = [
  ".github/",
  "build/",
  "site/",
  "wheelhouse/",
  "core/Results/",
  "docs/",
  "examples/notebooks/",
  "external/**/.git",
  "external/CoolProp/externals/Catch2/",
  "external/CoolProp/externals/ExcelAddinInstaller/",
  "external/CoolProp/externals/FindMathematica/",
  "external/CoolProp/externals/pybind11/",
  "external/CoolProp/externals/rapidjson/thirdparty/",
  "external/CoolProp/Web/",
  "external/CoolProp/wrappers/",
  "external/CoolProp/doc/",
  "external/dlib/examples/",
  "external/dlib/docs/",
  "external/dlib/tools/",
  "external/dlib/dlib/test/",
  "external/sundials/examples/",
  "external/sundials/benchmarks/",
  "external/sundials/test/",
  "external/sundials/doc/",
  "external/sundials/.gitlab/",
  "external/sundials/external/",
  "external/googletest/",
]

[tool.scikit-build.cmake.define]
ADSIM_BUILD_PYTHON = "ON"
ADSIM_BUILD_TESTS = "OFF"
ADSIM_INSTALL = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'set\(ADSIM_PROJECT_VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)\)\s*\nset\(ADSIM_VERSION_SUFFIX "(?P<suffix>(?:(?:a|b|rc)[0-9]+)?)"\)'
result = "{value}{suffix}"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
build-verbosity = 1
test-extras = ["test"]
test-command = "pytest {project}/python/tests -q"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
# 13.3: the first macOS whose libc++ has floating-point std::to_chars (used by
# core/src/solver/log.cpp). Keep in step with ADSIM_MIN_MACOS_VERSION in the
# root CMakeLists.txt.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
